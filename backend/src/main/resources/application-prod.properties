# ============================================================
# PROFIL PRODUCTION — Railway
# Activer via : SPRING_PROFILES_ACTIVE=prod  (variable Railway)
# Ce fichier surcharge application.properties pour la production
# ============================================================

# ── JPA / Hibernate ──────────────────────────────────────────
# none  → Hibernate ne touche PAS au schéma (Flyway gère tout)
# update en prod est dangereux : peut altérer des colonnes sans contrôle
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false

# ── HikariCP — Connection pool optimisé pour Neon (serverless) ──
# Neon free tier : max 25 connexions simultanées
# Pool conservateur pour éviter "too many connections"
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
# Neon ferme les connexions idle après ~5 min → idle-timeout < 5 min
spring.datasource.hikari.idle-timeout=180000
# max-lifetime < temps de fermeture serveur Neon (10 min)
spring.datasource.hikari.max-lifetime=600000
# keepalive évite "connection closed" sur connexions longues inactives
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-test-query=SELECT 1

# ── Logging ──────────────────────────────────────────────────
# Railway collecte stdout/stderr — pas besoin de fichier log
# Réduire le niveau pour diminuer les I/O et le CPU
logging.level.root=WARN
logging.level.com.example.stock_management=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.flywaydb=INFO
# Désactiver l'écriture en fichier (Railway = conteneur éphémère)
logging.file.name=

# ── Actuator ─────────────────────────────────────────────────
# /actuator/health utilisé par railway.toml comme healthcheck
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# ── Swagger ──────────────────────────────────────────────────
# Désactivé en production (évite exposition de l'API interne)
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# ── Compression HTTP ─────────────────────────────────────────
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,application/xml,text/html,text/plain

