spring.application.name=stock_management

# ========================================
# DATABASE CONFIGURATION - PostgreSQL
# ========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/stock_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ========================================
# JPA/HIBERNATE CONFIGURATION
# ========================================
# ddl-auto values: validate | update | create | create-drop
# - validate: vérifie la structure sans modifications
# - update: crée/modifie les tables si nécessaire
# - create: crée toutes les tables (efface l'existant)
# - create-drop: crée et efface les tables au démarrage/arrêt
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# ========================================
# DATA INITIALIZATION
# ========================================
# Activer le chargement automatique des fichiers SQL (data.sql uniquement)
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
# ========================================
# CSV DATA LOADER CONFIGURATION
# ========================================
# Le service CsvDataLoaderService charge automatiquement les données depuis Products.csv
# au démarrage de l'application si aucune donnée n'existe

# ========================================
# SERVER CONFIGURATION
# ========================================
server.port=8080
server.servlet.context-path=/
server.compression.enabled=true
server.compression.min-response-size=1024

# ========================================
# LOGGING CONFIGURATION
# ========================================
logging.level.root=INFO
logging.level.com.example.stock_management=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.file.name=logs/stock_management.log
logging.file.max-size=10MB
logging.file.max-history=10
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ========================================
# ACTUATOR/MANAGEMENT
# ========================================
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=always
management.health.defaults.enabled=true

# ========================================
# SWAGGER/OPENAPI CONFIGURATION
# ========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ========================================
# CORS CONFIGURATION
# ========================================
cors.allowedOrigins=http://localhost:3000,http://localhost:4200,http://localhost:8081,http://localhost:8082

# ========================================
# APPLICATION CUSTOM PROPERTIES
# ========================================
app.name=Stock Management API
app.version=1.0.0
app.description=API REST pour la gestion de stock avec CMP

# ========================================
# EMAIL CONFIGURATION (SMTP)
# ========================================
# Configuration pour Gmail (modifier selon votre fournisseur)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=votre-email@gmail.com
spring.mail.password=votre-mot-de-passe-application
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Email de l'entreprise (expéditeur)
app.mail.from=facturation@votre-entreprise.com
app.mail.from-name=Service Facturation

