spring.application.name=stock_management

# ========================================
# DATABASE CONFIGURATION - PostgreSQL
# ========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/stock_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ========================================
# JPA/HIBERNATE CONFIGURATION
# ========================================
# ddl-auto values: validate | update | create | create-drop
# - validate: vérifie la structure sans modifications (RECOMMANDÉ avec Flyway)
# - update: crée/modifie les tables si nécessaire (CONSERVE LES DONNÉES)
# - create: crée toutes les tables (efface l'existant)
# - create-drop: crée et efface les tables au démarrage/arrêt
# NOTE: 'update' permet à Hibernate de créer les tables initiales, Flyway gère les migrations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# ========================================
# DATA INITIALIZATION
# ========================================
# Désactiver pour éviter conflit avec Flyway
spring.sql.init.mode=never

# ========================================
# FLYWAY MIGRATION CONFIGURATION
# ========================================
# Activer Flyway pour les migrations de base de données
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true

# ========================================
# CSV DATA LOADER CONFIGURATION
# ========================================
# Le service CsvDataLoaderService charge automatiquement les données depuis Products.csv
# au démarrage de l'application si aucune donnée n'existe

# ========================================
# SERVER CONFIGURATION
# ========================================
server.port=8080
server.servlet.context-path=/
server.compression.enabled=true
server.compression.min-response-size=1024

# ========================================
# LOGGING CONFIGURATION
# ========================================
logging.level.root=INFO
logging.level.com.example.stock_management=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.file.name=logs/stock_management.log
logging.file.max-size=10MB
logging.file.max-history=10
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ========================================
# ACTUATOR/MANAGEMENT
# ========================================
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=always
management.health.defaults.enabled=true

# ========================================
# SWAGGER/OPENAPI CONFIGURATION
# ========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ========================================
# CORS CONFIGURATION
# ========================================
cors.allowedOrigins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:8081,http://localhost:8082,https://stockmanagement-production-29ae.up.railway.app}

# ========================================
# APPLICATION CUSTOM PROPERTIES
# ========================================
app.name=Stock Management API
app.version=1.0.0
app.description=API REST pour la gestion de stock avec CMP

# ========================================
# RESEND — EMAIL API (tous les emails)
# ========================================
# Obtenez votre clé sur https://resend.com/api-keys
# Injectez via variable d'environnement : RESEND_API_KEY=re_xxxx
resend.api-key=${RESEND_API_KEY:dev-placeholder-key}
# Domaine vérifié sur Resend (ou onboarding@resend.dev pour les tests)
resend.from-email=${RESEND_FROM_EMAIL:onboarding@resend.dev}
resend.from-name=${RESEND_FROM_NAME:Stock ERP}


# ========================================
# JWT CONFIGURATION
# ========================================
app.jwt.secret=${JWT_SECRET:mySecretKeyForJWTTokenGenerationThatIsAtLeast256BitsLongForSecurity}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# ========================================
# FRONTEND URL (pour les liens dans les emails)
# ========================================
app.frontend.url=${FRONTEND_URL:http://localhost:4200}
