spring.datasource.url=jdbc:h2:mem:stock_test_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.flyway.enabled=false
spring.sql.init.mode=never

# Keep JWT/CORS placeholders explicit for test context startup.
app.jwt.secret=mySecretKeyForJWTTokenGenerationThatIsAtLeast256BitsLongForSecurity
app.jwt.expiration=86400000
cors.allowedOrigins=http://localhost:4200


