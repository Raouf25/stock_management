<!-- Auth pages (no sidebar) -->
<ng-container *ngIf="isAuthRoute()">
  <router-outlet></router-outlet>
</ng-container>

<!-- Main app with sidebar -->
<ng-container *ngIf="!isAuthRoute()">

  <!-- Mobile overlay -->
  <div class="sidebar-overlay" *ngIf="sidebarOpen" (click)="toggleSidebarOpen()"></div>

  <!-- ══ SIDEBAR ══ -->
  <aside class="sidebar" [class.show]="sidebarOpen" [class.collapsed]="sidebarCollapsed">

    <!-- Logo -->
    <div class="sidebar-logo" (click)="toggleSidebar()">
      <div class="logo-icon">
        <i class="bi bi-boxes"></i>
      </div>
      <span class="logo-text">Bhouri Stock</span>
    </div>

    <!-- Navigation -->
    <nav class="sidebar-nav">

      <!-- ── GÉNÉRAL ── -->
      <p class="nav-section">Général</p>

      <a class="nav-link" routerLink="/" routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: true }" (click)="closeSidebarOnMobile()">
        <i class="bi bi-speedometer2"></i>
        <span>Dashboard</span>
      </a>

      <a class="nav-link" routerLink="/products" routerLinkActive="active"
         (click)="closeSidebarOnMobile()">
        <i class="bi bi-box-seam"></i>
        <span>Produits</span>
      </a>

      <a class="nav-link" routerLink="/customers" routerLinkActive="active"
         (click)="closeSidebarOnMobile()">
        <i class="bi bi-people"></i>
        <span>Clients</span>
      </a>

      <a class="nav-link" routerLink="/suppliers" routerLinkActive="active"
         (click)="closeSidebarOnMobile()">
        <i class="bi bi-building"></i>
        <span>Fournisseurs</span>
      </a>

      <a class="nav-link" routerLink="/transactions" routerLinkActive="active"
         (click)="closeSidebarOnMobile()">
        <i class="bi bi-arrow-left-right"></i>
        <span>Transactions</span>
      </a>

      <!-- ── DOCUMENTS ── -->
      <p class="nav-section">Documents</p>

      <a class="nav-link nav-link--cta" routerLink="/documents/create"
         routerLinkActive="active" (click)="closeSidebarOnMobile()">
        <i class="bi bi-plus-circle-fill"></i>
        <span>Nouveau Document</span>
      </a>

      <a class="nav-link" routerLink="/invoices/list" routerLinkActive="active"
         (click)="closeSidebarOnMobile()">
        <i class="bi bi-receipt"></i>
        <span>Factures</span>
      </a>

      <a class="nav-link" routerLink="/delivery-notes/list" routerLinkActive="active"
         (click)="closeSidebarOnMobile()">
        <i class="bi bi-truck"></i>
        <span>Bons Livraison</span>
      </a>

    </nav>

    <!-- Footer / User -->
    <div class="sidebar-footer">
      <a class="user-card" routerLink="/profile" routerLinkActive="user-card--active"
         (click)="closeSidebarOnMobile()">
        <div class="user-avatar">
          <span>{{ getUserInitials() }}</span>
        </div>
        <div class="user-info">
          <div class="user-name">{{ authService.currentUser?.name || 'Utilisateur' }}</div>
          <div class="user-email">{{ getTruncatedEmail() }}</div>
        </div>
        <button class="btn-logout" (click)="$event.preventDefault(); $event.stopPropagation(); logout()"
                title="Déconnexion">
          <i class="bi bi-box-arrow-right"></i>
        </button>
      </a>
    </div>

  </aside>

  <!-- ══ MAIN CONTENT ══ -->
  <div class="main-content" [class.sidebar-collapsed]="sidebarCollapsed">
    <button class="mobile-hamburger" (click)="toggleSidebarOpen()">
      <i class="bi bi-list"></i>
    </button>
    <div class="page-content">
      <router-outlet></router-outlet>
    </div>
  </div>

</ng-container>
