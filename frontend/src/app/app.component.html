<!-- Auth pages (no sidebar) -->
<ng-container *ngIf="isAuthRoute()">
  <router-outlet></router-outlet>
</ng-container>

<!-- Main app with sidebar -->
<ng-container *ngIf="!isAuthRoute()">
  <!-- Overlay pour mobile -->
  <div class="sidebar-overlay" *ngIf="sidebarOpen" (click)="toggleSidebarOpen()" [@fadeInOut]></div>
  
  <!-- Sidebar -->
  <div class="sidebar" [class.show]="sidebarOpen" [class.collapsed]="sidebarCollapsed">
    <div class="sidebar-header">
      <div class="logo-wrapper" (click)="toggleSidebar()">
        <div class="logo-icon">
          <i class="bi bi-gear-fill"></i>
        </div>
        <span class="logo-text">Stock ERP</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <ul class="nav-menu">
        <li class="nav-item">
          <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeSidebarOnMobile()">
            <i class="bi bi-speedometer2"></i>
            <span>Dashboard</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/products" routerLinkActive="active" (click)="closeSidebarOnMobile()">
            <i class="bi bi-box-seam"></i>
            <span>Produits</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/purchases" routerLinkActive="active" (click)="closeSidebarOnMobile()">
            <i class="bi bi-cart-plus"></i>
            <span>Achats</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/sales" routerLinkActive="active" (click)="closeSidebarOnMobile()">
            <i class="bi bi-graph-up"></i>
            <span>Ventes</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/stock-movements" routerLinkActive="active" (click)="closeSidebarOnMobile()">
            <i class="bi bi-arrow-left-right"></i>
            <span>Mouvements</span>
          </a>
        </li>
        
        <!-- Facturation avec sous-menu -->
        <li class="nav-item has-submenu" [class.open]="invoiceMenuOpen">
          <a class="nav-link" (click)="toggleInvoiceMenu()" [class.active]="isInvoiceRouteActive()">
            <i class="bi bi-receipt"></i>
            <span>Facturation</span>
            <i class="bi chevron-icon" [class.bi-chevron-down]="!invoiceMenuOpen" [class.bi-chevron-up]="invoiceMenuOpen"></i>
          </a>
          <ul class="submenu" [class.show]="invoiceMenuOpen">
            <li>
              <a class="submenu-link" routerLink="/invoices/create" routerLinkActive="active" (click)="closeSidebarOnMobile()">
                <i class="bi bi-plus-circle"></i>
                <span>Créer Facture</span>
              </a>
            </li>
            <li>
              <a class="submenu-link" routerLink="/invoices/list" routerLinkActive="active" (click)="closeSidebarOnMobile()">
                <i class="bi bi-list-ul"></i>
                <span>Lister Factures</span>
              </a>
            </li>
          </ul>
        </li>
      </ul>
    </nav>

    <div class="sidebar-footer">
      <div class="user-card">
        <div class="user-avatar">
          <span class="avatar-text">{{ getUserInitials() }}</span>
        </div>
        <div class="user-info">
          <div class="user-name">{{ authService.currentUser?.name || 'Utilisateur' }}</div>
          <div class="user-email">{{ getTruncatedEmail() }}</div>
        </div>
        <button class="btn-logout" (click)="logout()" title="Déconnexion">
          <i class="bi bi-box-arrow-right"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main-content" [class.sidebar-collapsed]="sidebarCollapsed">
    <!-- Mobile Hamburger Menu -->
    <button class="mobile-hamburger" (click)="toggleSidebarOpen()">
      <i class="bi bi-list"></i>
    </button>

    <!-- Page Content -->
    <div class="page-content">
      <router-outlet></router-outlet>
    </div>
  </div>
</ng-container>
