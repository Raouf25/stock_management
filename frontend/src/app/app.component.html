<!-- Auth pages (no sidebar) -->
<ng-container *ngIf="isAuthRoute()">
  <router-outlet></router-outlet>
</ng-container>

<!-- Main app with sidebar -->
<ng-container *ngIf="!isAuthRoute()">
  <!-- Sidebar -->
  <div class="sidebar" [class.collapsed]="sidebarCollapsed">
    <div class="sidebar-header">
      <div class="logo">
        <i class="bi bi-boxes me-2"></i>
        <span *ngIf="!sidebarCollapsed">Stock ERP</span>
      </div>
      <button class="btn btn-link sidebar-toggle" (click)="toggleSidebar()">
        <i class="bi" [class]="sidebarCollapsed ? 'bi-chevron-right' : 'bi-chevron-left'"></i>
      </button>
    </div>

    <nav class="sidebar-nav">
      <ul class="nav flex-column">
        <li class="nav-item">
          <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
            <i class="bi bi-speedometer2 me-2"></i>
            <span *ngIf="!sidebarCollapsed">Dashboard</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/products" routerLinkActive="active">
            <i class="bi bi-box-seam me-2"></i>
            <span *ngIf="!sidebarCollapsed">Produits</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/purchases" routerLinkActive="active">
            <i class="bi bi-cart-plus me-2"></i>
            <span *ngIf="!sidebarCollapsed">Achats</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/sales" routerLinkActive="active">
            <i class="bi bi-graph-up me-2"></i>
            <span *ngIf="!sidebarCollapsed">Ventes</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/stock-movements" routerLinkActive="active">
            <i class="bi bi-arrow-left-right me-2"></i>
            <span *ngIf="!sidebarCollapsed">Mouvements</span>
          </a>
        </li>
        
        <!-- Facturation avec sous-menu -->
        <li class="nav-item has-submenu">
          <a class="nav-link" (click)="toggleInvoiceMenu()" [class.active]="isInvoiceRouteActive()">
            <i class="bi bi-receipt me-2"></i>
            <span *ngIf="!sidebarCollapsed">Facturation</span>
            <i *ngIf="!sidebarCollapsed" class="bi ms-auto" [class.bi-chevron-down]="invoiceMenuOpen" [class.bi-chevron-right]="!invoiceMenuOpen"></i>
          </a>
          <ul class="submenu" [class.show]="invoiceMenuOpen && !sidebarCollapsed">
            <li>
              <a class="nav-link" routerLink="/invoices/dashboard" routerLinkActive="active">
                <i class="bi bi-graph-up-arrow me-2"></i>
                Dashboard
              </a>
            </li>
            <li>
              <a class="nav-link" routerLink="/invoices/create" routerLinkActive="active">
                <i class="bi bi-plus-circle me-2"></i>
                Créer Facture
              </a>
            </li>
            <li>
              <a class="nav-link" routerLink="/invoices/list" routerLinkActive="active">
                <i class="bi bi-list-ul me-2"></i>
                Lister Factures
              </a>
            </li>
          </ul>
        </li>
      </ul>
    </nav>

    <div class="sidebar-footer" *ngIf="!sidebarCollapsed">
      <div class="user-info">
        <div class="user-avatar">
          <i class="bi bi-person-circle"></i>
        </div>
        <div class="user-details">
          <div class="user-name">{{ authService.currentUser?.name || 'Utilisateur' }}</div>
          <div class="user-role">{{ authService.currentUser?.email || '' }}</div>
        </div>
        <button class="btn-logout" (click)="logout()" title="Déconnexion">
          <i class="bi bi-box-arrow-right"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main-content" [class.sidebar-collapsed]="sidebarCollapsed">

    <!-- Page Content -->
    <div class="page-content">
      <router-outlet></router-outlet>
    </div>
  </div>
</ng-container>
