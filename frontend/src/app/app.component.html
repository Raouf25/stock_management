<!-- Auth pages (no sidebar) -->
<ng-container *ngIf="isAuthRoute()">
  <router-outlet></router-outlet>
</ng-container>

<!-- Main app with sidebar -->
<ng-container *ngIf="!isAuthRoute()">
  <!-- Overlay for mobile -->
  <div class="sidebar-overlay" *ngIf="sidebarOpen" (click)="toggleSidebarOpen()"></div>

  <!-- Sidebar -->
  <div class="sidebar" [class.show]="sidebarOpen" [class.collapsed]="sidebarCollapsed">

    <!-- ── Header / Logo ── -->
    <div class="sidebar-header">
      <div class="logo-wrapper" (click)="toggleSidebar()">
        <div class="logo-icon"><i class="bi bi-gear-fill"></i></div>
        <span class="logo-text">Stock ERP</span>
      </div>
    </div>

    <!-- ── Navigation ── -->
    <nav class="sidebar-nav">
      <ul class="nav-menu">

        <!-- ─ SECTION: GÉNÉRAL ─ -->
        <li class="nav-section-label">
          <span>Général</span>
        </li>

        <li class="nav-item">
          <a class="nav-link" routerLink="/" routerLinkActive="active"
             [routerLinkActiveOptions]="{ exact: true }" (click)="closeSidebarOnMobile()">
            <i class="bi bi-speedometer2"></i>
            <span>Dashboard</span>
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" routerLink="/products" routerLinkActive="active" (click)="closeSidebarOnMobile()">
            <i class="bi bi-box-seam"></i>
            <span>Produits</span>
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" routerLink="/transactions" routerLinkActive="active" (click)="closeSidebarOnMobile()">
            <i class="bi bi-arrow-left-right"></i>
            <span>Transactions</span>
          </a>
        </li>

        <!-- ─ SECTION: TIERS ─ -->
        <li class="nav-section-label">
          <span>Tiers</span>
        </li>

        <li class="nav-item">
          <a class="nav-link" routerLink="/customers" routerLinkActive="active" (click)="closeSidebarOnMobile()">
            <i class="bi bi-people"></i>
            <span>Clients</span>
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" routerLink="/suppliers" routerLinkActive="active" (click)="closeSidebarOnMobile()">
            <i class="bi bi-building"></i>
            <span>Fournisseurs</span>
          </a>
        </li>

        <!-- ─ SECTION: DOCUMENTS ─ -->
        <li class="nav-section-label">
          <span>Documents</span>
        </li>

        <!-- CTA: Créer Facture / BL -->
        <li class="nav-item">
          <a class="nav-link nav-link--create" routerLink="/documents/create"
             routerLinkActive="active" (click)="closeSidebarOnMobile()">
            <i class="bi bi-plus-circle-fill"></i>
            <span>Créer Facture / BL</span>
          </a>
        </li>

        <!-- Collapsible group: Facturation + BL -->
        <li class="nav-item has-submenu" [class.open]="documentsMenuOpen">
          <a class="nav-link" (click)="toggleDocumentsMenu()" [class.active]="isDocumentListRouteActive()">
            <i class="bi bi-folder2-open"></i>
            <span>Archives</span>
            <i class="bi chevron-icon"
               [class.bi-chevron-down]="!documentsMenuOpen"
               [class.bi-chevron-up]="documentsMenuOpen"></i>
          </a>
          <ul class="submenu" [class.show]="documentsMenuOpen">
            <li>
              <a class="submenu-link" routerLink="/invoices/list"
                 routerLinkActive="active" (click)="closeSidebarOnMobile()">
                <i class="bi bi-receipt"></i>
                <span>Factures</span>
              </a>
            </li>
            <li>
              <a class="submenu-link" routerLink="/delivery-notes/list"
                 routerLinkActive="active" (click)="closeSidebarOnMobile()">
                <i class="bi bi-truck"></i>
                <span>Bons de Livraison</span>
              </a>
            </li>
          </ul>
        </li>

      </ul>
    </nav>

    <!-- ── Footer / User ── -->
    <div class="sidebar-footer">
      <div class="user-card">
        <div class="user-avatar">
          <span class="avatar-text">{{ getUserInitials() }}</span>
        </div>
        <div class="user-info">
          <div class="user-name">{{ authService.currentUser?.name || 'Utilisateur' }}</div>
          <div class="user-email">{{ getTruncatedEmail() }}</div>
        </div>
        <button class="btn-logout" (click)="logout()" title="Déconnexion">
          <i class="bi bi-box-arrow-right"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- ── Main Content ── -->
  <div class="main-content" [class.sidebar-collapsed]="sidebarCollapsed">
    <button class="mobile-hamburger" (click)="toggleSidebarOpen()">
      <i class="bi bi-list"></i>
    </button>
    <div class="page-content">
      <router-outlet></router-outlet>
    </div>
  </div>
</ng-container>
