<div class="invoice-page-container">
  <div class="invoice-page-header">
    <div style="display: flex; align-items: center; gap: 1rem;">
      <span style="font-size: 2rem;">➕</span>
      <h1 class="invoice-page-title">Nouveau Fournisseur</h1>
    </div>
    <button (click)="router.navigate(['/suppliers'])"
            style="padding: 0.75rem 1.5rem; background: #6b7280; color: white; border: none; border-radius: 0.5rem; cursor: pointer; font-weight: 600;">
      ← Retour
    </button>
  </div>
  <div class="invoice-card">
    <div class="invoice-card-header gradient-purple">
      <span style="font-size: 1rem;">📝</span>
      <span class="invoice-card-header-title">Informations Fournisseur</span>
    </div>
    <form (ngSubmit)="save()" style="padding: 2rem; max-width: 600px; margin: auto;">
      <div class="form-group">
        <label>Nom <span style="color: #ef4444;">*</span></label>
        <input class="form-control" [(ngModel)]="supplier.name" name="name" required />
      </div>
      <div class="form-group">
        <label>Contact</label>
        <input class="form-control" [(ngModel)]="supplier.contactPerson" name="contactPerson" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input class="form-control" [(ngModel)]="supplier.email" name="email" type="email" />
      </div>
      <div class="form-group">
        <label>Téléphone</label>
        <input class="form-control" [(ngModel)]="supplier.phone" name="phone" />
      </div>
      <div class="form-group">
        <label>Adresse</label>
        <input class="form-control" [(ngModel)]="supplier.address" name="address" />
      </div>
      <div class="form-group">
        <label>Site web</label>
        <input class="form-control" [(ngModel)]="supplier.webSite" name="webSite" />
      </div>
      <div *ngIf="error" class="alert alert-warning">{{ error }}</div>
      <button class="btn-refresh" type="submit" [disabled]="isSaving">Créer</button>
      <button class="btn-refresh" type="button" (click)="router.navigate(['/suppliers'])">Annuler</button>
    </form>
  </div>
</div>
