version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: stock_management_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: stock_db
    volumes:
      - stock_postgres_data:/var/lib/postgresql/data
    networks:
      - stock_network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      timeout: 20s
      retries: 10

  # Spring Boot Application
  stock_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stock_management_app
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/stock_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    volumes:
      - ./src:/app/src
      - ./logs:/app/logs
    networks:
      - stock_network

volumes:
  stock_postgres_data:
    driver: local

networks:
  stock_network:
    driver: bridge