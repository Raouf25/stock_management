version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: stock_management_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: stock_db
    volumes:
      - stock_postgres_data:/var/lib/postgresql/data
    networks:
      - stock_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Spring Boot Application (Backend)
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: stock_management_backend
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/stock_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    volumes:
      - ./backend/src:/app/src
      - ./logs:/app/logs
    networks:
      - stock_network
#    healthcheck:
#      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health || exit 1"]
#      interval: 30s
#      timeout: 10s
#      retries: 5
#      start_period: 60s

  # Angular Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
      args:
        - NODE_OPTIONS=--max_old_space_size=4096
    container_name: stock_management_frontend
    ports:
      - "4200:4200"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - API_URL=http://backend:8080
      - NODE_OPTIONS=--max_old_space_size=2048
    volumes:
      - ./frontend/src:/app/src
    networks:
      - stock_network
    restart: unless-stopped

volumes:
  stock_postgres_data:
    driver: local

networks:
  stock_network:
    driver: bridge

